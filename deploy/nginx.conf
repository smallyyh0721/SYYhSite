server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 client_max_body_size 8k;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
 location /api/ {
  proxy_pass http://api:3001;
  proxy_set_header Host $host;
  # Overwrite client-supplied values. API trusts only this single internal hop.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;
 }
 location /_next/static/ { expires 1y; add_header Cache-Control 'public, immutable'; }
 location /media/ { expires 1h; }
 location / { try_files $uri $uri/ =404; add_header Cache-Control 'no-cache'; }
 error_page 404 /404.html;
 location = /404.html { internal; }
}
