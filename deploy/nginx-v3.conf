pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  include /etc/nginx/syyh/upstreams.conf;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;
  client_body_timeout 30s;
  client_header_timeout 10s;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_zone $binary_remote_addr zone=login:1m rate=2r/s;
  limit_req_zone $binary_remote_addr zone=messages:1m rate=1r/s;
  limit_conn_zone $binary_remote_addr zone=uploads:1m;
  limit_conn_zone $binary_remote_addr zone=requests:1m;
  map $scheme $syyh_hsts { https 'max-age=86400'; default ''; }
  gzip on;
  gzip_types text/css application/javascript;
  server {
    listen 8080 default_server;
    server_name _;
    include /etc/nginx/syyh/security.conf;
    location = /health { access_log off; default_type text/plain; return 200 'ok'; }
    location ^~ /.well-known/acme-challenge/ { root /srv/acme; default_type text/plain; try_files $uri =404; }
    location / { return 308 https://124.220.190.120$request_uri; }
  }
  server {
    listen 8443 ssl default_server;
    server_name 124.220.190.120;
    if ($host != '124.220.190.120') { return 421; }
    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    include /etc/nginx/syyh/locations.conf;
  }
}
