pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  include /etc/nginx/syyh/upstreams.conf;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_zone $binary_remote_addr zone=login:1m rate=2r/s;
  limit_req_zone $binary_remote_addr zone=messages:1m rate=1r/s;
  limit_conn_zone $binary_remote_addr zone=uploads:1m;
  limit_conn_zone $binary_remote_addr zone=requests:1m;
  map $scheme $syyh_hsts { default ''; }
  server { listen 8080; server_name localhost 127.0.0.1; include /etc/nginx/syyh/locations.conf; }
}
