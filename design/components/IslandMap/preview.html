<!-- @dsCard group="World" height=520 subtitle="Click an island to see the jump" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>IslandMap</title>
<style>#root{height:500px;border-bottom:3px solid var(--line)}</style></head>
<body><div id="root"></div>
<script>
  var S = window.SYYH, h = React.createElement;
  var islands = [
    { id: 'a', letter: 'A', name: 'Works', kana: 'サクヒン', channel: 'CH-01', tone: 'a', x: 380, y: 330 },
    { id: 'b', letter: 'B', name: 'About', kana: 'ジコショウカイ', channel: 'CH-02', tone: 'b', x: 1180, y: 280 },
    { id: 'c', letter: 'C', name: 'Story', kana: 'モノガタリ', channel: 'CH-03', tone: 'c', x: 520, y: 760 },
    { id: 'd', letter: 'D', name: 'Board', kana: 'ケイジバン', channel: 'CH-04', tone: 'd', x: 1220, y: 740 }];
  function Demo() {
    var st = React.useState(null), arrived = st[0], set = st[1];
    return h('div', { style: { position: 'relative', height: '100%' } },
      h(S.IslandMap, { islands: islands, onArrive: set }),
      arrived ? h('div', { style: { position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', background: 'var(--void)', zIndex: 300 } },
        h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 24 } },
          h(S.SectionTitle, { index: arrived.channel, title: arrived.name, kana: arrived.kana, tone: arrived.tone, size: 'hero', as: 'h1' }),
          h(S.Button, { variant: 'ghost', onClick: function () { set(null); } }, '◀ BACK TO HUB'))) : null);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script></body></html>
