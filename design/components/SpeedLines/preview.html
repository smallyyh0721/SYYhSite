<!-- @dsCard group="World" height=260 subtitle="Click to replay the burst" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>SpeedLines</title>
<style>#root{position:relative;height:240px;margin:10px;border:3px solid var(--line);background:var(--surface);overflow:hidden;cursor:pointer}
#root .label{position:absolute;inset:0;display:grid;place-items:center;z-index:200}</style></head>
<body><div id="root"></div>
<script>
  var S = window.SYYH, h = React.createElement;
  function Demo() {
    var st = React.useState(true), on = st[0], set = st[1];
    function replay() { set(false); setTimeout(function () { set(true); }, 60); }
    return h('div', { onClick: replay, style: { position: 'absolute', inset: 0 } },
      h(S.SpeedLines, { active: on, tone: 'b' }),
      h('div', { className: 'label' }, h('span', { className: 'sfx', style: { transform: 'rotate(-4deg)', color: 'var(--ink)' } }, 'ビュンッ！')));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script></body></html>
