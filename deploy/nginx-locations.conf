include /etc/nginx/syyh/security.conf;
client_max_body_size 8k;
location = /health { access_log off; default_type text/plain; return 200 'ok'; }
location ^~ /.well-known/acme-challenge/ { root /srv/acme; default_type text/plain; try_files $uri =404; }
location = /api/owner/uploads {
  include /etc/nginx/syyh/security.conf;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
  client_max_body_size 30m;
  limit_conn uploads 2;
  proxy_request_buffering on;
  proxy_pass $syyh_api;
  include /etc/nginx/syyh/proxy.conf;
}
location = /api/owner/session {
  include /etc/nginx/syyh/security.conf;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
  limit_req zone=login burst=5 nodelay;
  proxy_pass $syyh_api;
  include /etc/nginx/syyh/proxy.conf;
}
location = /api/messages {
  include /etc/nginx/syyh/security.conf;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
  limit_req zone=messages burst=5 nodelay;
  proxy_pass $syyh_api;
  include /etc/nginx/syyh/proxy.conf;
}
location /api/ {
  include /etc/nginx/syyh/security.conf;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
  client_max_body_size 512k;
  limit_conn requests 24;
  proxy_buffering off;
  proxy_pass $syyh_api;
  include /etc/nginx/syyh/proxy.conf;
}
# Preview-only seed images must never bypass publication checks.
location ^~ /media/v3/works/ { return 404; }
location ~ (^|/)\. { return 404; }
location / {
  proxy_pass $syyh_frontend;
  include /etc/nginx/syyh/proxy.conf;
}
