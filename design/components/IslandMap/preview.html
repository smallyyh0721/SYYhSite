<!-- @dsCard group="World" height=560 width=1280 subtitle="Move the mouse (or scroll) to travel; click the focused island to enter" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>IslandMap</title>
<style>#root{height:540px}</style></head>
<body><div id="root"></div>
<script>
  var S = window.SYYH, h = React.createElement;
  var islands = [
    { id: 'a', letter: 'A', name: 'Works', kana: 'サクヒン', channel: 'CH-01', tone: 'a', x: 560, y: 470, blurb: 'Key visuals, AIGC series and manga pages.' },
    { id: 'b', letter: 'B', name: 'About', kana: 'ジコショウカイ', channel: 'CH-02', tone: 'b', x: 1820, y: 400, blurb: 'Who is behind the signal.' },
    { id: 'c', letter: 'C', name: 'Story', kana: 'モノガタリ', channel: 'CH-03', tone: 'c', x: 760, y: 1130, blurb: 'A scroll-driven episode.' },
    { id: 'd', letter: 'D', name: 'Board', kana: 'ケイジバン', channel: 'CH-04', tone: 'd', x: 1880, y: 1100, blurb: 'Contact and guestbook.' }];
  function Demo() {
    var st = React.useState(null), entered = st[0], set = st[1];
    return h('div', { style: { position: 'relative', height: '100%' } },
      entered ? h('div', { style: { position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', background: 'var(--void)' } },
        h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 24 } },
          h(S.SectionTitle, { index: entered.channel, title: entered.name, kana: entered.kana, tone: entered.tone, size: 'hero', as: 'h1' }),
          h(S.Button, { variant: 'ghost', onClick: function () { set(null); } }, '◀ BACK TO HUB')))
      : h(S.IslandMap, { islands: islands, onEnter: set }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script></body></html>
